name: Avisos wellness y RPE
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch: {}       # botón para lanzarlo a mano y probar
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: scripts
      - run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT: todavía no se envían avisos."; exit 0; fi
          export SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/index.html"
          node notify.mjs
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
