name: Avisos wellness y RPE
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón para lanzarlo a mano y probar
    inputs:
      mensaje:
        description: "Mensaje de prueba para todas (vacío = funcionamiento normal)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: scripts
      - run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT: todavía no se envían avisos."; exit 0; fi
          export SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/index.html"
          node notify.mjs
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MENSAJE: ${{ github.event.inputs.mensaje }}
          TEST_MSG: ${{ github.event.inputs.mensaje }}
      # GitHub pausa las tareas programadas tras 60 días sin cambios en el repositorio:
      # cada ~45 días se hace un pequeño commit automático para mantenerlo activo.
      - name: Mantener el repositorio activo
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45*24*3600 )) ]; then
            date -u +%Y-%m-%d > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -m "Mantener activos los avisos automáticos" && git push
          fi
